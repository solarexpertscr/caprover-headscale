server_url: "https://solarassistant.container.solarexperts.cr"
listen_addr: "0.0.0.0:8080"
metrics_listen_addr: "0.0.0.0:9090"

# Database configuration
database:
  type: sqlite
  sqlite:
    path: "/var/lib/headscale/db.sqlite"
    write_ahead_log: true

# Noise protocol configuration (Required since 0.23)
noise:
  private_key_path: "/var/lib/headscale/noise_private.key"

# Tailscale IP prefixes (Required)
prefixes:
  v4: "100.64.0.0/10"
  v6: "fd7a:115c:a1e0::/48"
  allocation: sequential

# DNS configuration
# Note: base_domain is read from here (dns.base_domain), not the top level.
# It must differ from server_url, or Tailscale's MagicDNS takeover of the
# base domain makes the headscale server and DERP unreachable.
dns:
  base_domain: "headscale.net"
  magic_dns: true
  # Ad blocking for every device while it is on the tailnet, by overriding each
  # client's local resolver.
  #
  # This headscale runs in the cloud (CapRover VPS), not on the home LAN, and it
  # only *hands these addresses to clients* - it does not resolve on their behalf
  # and has no route to a private network. So the addresses must be reachable
  # from wherever a client happens to be. A public resolver works from anywhere;
  # a 192.168.68.x address, or even a 100.64.x.x one, is only reachable while the
  # device has a working path to that network, and because override_local_dns
  # replaces the device's own resolver a failure there costs it all name
  # resolution, not just ad filtering.
  #
  # AdGuard DNS public ad-blocking pair, both listed as published for redundancy.
  # Other variants, if ever wanted instead:
  #   family protection  94.140.14.15  / 94.140.15.16
  #   non-filtering      94.140.14.140 / 94.140.15.141
  override_local_dns: true
  nameservers:
    global:
      - "94.140.14.14"
      - "94.140.15.15"

# DERP configuration
# The embedded DERP server guarantees a valid DERP map on startup.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: "/var/lib/headscale/derp_server_private.key"
  urls:
    - https://controlplane.tailscale.com/derpmap/default

# Policy configuration
# mode: database is required for headplane to write policies through the API
# (PUT v1/policy returns "update is disabled for modes other than 'database'"
# in file mode). The file below is the fallback policy used on first boot,
# before anything has been stored in the database.
policy:
  mode: database
  path: "/etc/headscale/acl.hujson"

log:
  format: "text"
  level: "info"
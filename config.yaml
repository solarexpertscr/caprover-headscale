server_url: "https://solarassistant.container.solarexperts.cr"
listen_addr: "0.0.0.0:8080"
metrics_listen_addr: "0.0.0.0:9090"

# Database configuration
database:
  type: sqlite
  sqlite:
    path: "/var/lib/headscale/db.sqlite"
    write_ahead_log: true

# Noise protocol configuration (Required since 0.23)
noise:
  private_key_path: "/var/lib/headscale/noise_private.key"

# Tailscale IP prefixes (Required)
prefixes:
  v4: "100.64.0.0/10"
  v6: "fd7a:115c:a1e0::/48"
  allocation: sequential

# DNS configuration
# Note: base_domain is read from here (dns.base_domain), not the top level.
# It must differ from server_url, or Tailscale's MagicDNS takeover of the
# base domain makes the headscale server and DERP unreachable.
dns:
  base_domain: "headscale.net"
  magic_dns: true
  # Hand clients the filtering resolver instead of a public one, so ad blocking
  # applies on every device while it is on the tailnet.
  #
  # Addressed by the resolver's TAILNET IP (the Home Assistant box), not its LAN
  # address: a 192.168.68.x server is only reachable from the home network, and a
  # phone on mobile data would then get a DNS server it cannot reach - which
  # breaks all name resolution on that device, not just ad filtering.
  #
  # Deliberately the only listed server. A public fallback here would be used by
  # clients alongside this one and would silently bypass filtering, which defeats
  # the point. The trade-off is that if the resolver is down, tailnet clients
  # have no DNS until it returns; roll back by reverting this commit.
  override_local_dns: true
  nameservers:
    global:
      - "100.64.0.9"

# DERP configuration
# The embedded DERP server guarantees a valid DERP map on startup.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: "/var/lib/headscale/derp_server_private.key"
  urls:
    - https://controlplane.tailscale.com/derpmap/default

# Policy configuration
# mode: database is required for headplane to write policies through the API
# (PUT v1/policy returns "update is disabled for modes other than 'database'"
# in file mode). The file below is the fallback policy used on first boot,
# before anything has been stored in the database.
policy:
  mode: database
  path: "/etc/headscale/acl.hujson"

log:
  format: "text"
  level: "info"